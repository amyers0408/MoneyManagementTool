<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Chart.js CDN for visual summaries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Budget Tracker</h1>
            <p>Manage your finances seamlessly</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card balance">
                <h3>Total Balance</h3>
                <p id="total-balance">$0.00</p>
            </div>
            <div class="card income">
                <h3>Total Income</h3>
                <p id="total-income">$0.00</p>
            </div>
            <div class="card expenses">
                <h3>Total Expenses</h3>
                <p id="total-expenses">$0.00</p>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Form & Chart Section -->
            <div class="left-panel">
                <div class="form-container">
                    <h2>Add Transaction</h2>
                    <form id="transaction-form">
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="description" placeholder="e.g. Grocery Store" required>
                        </div>
                        <div class="form-group">
                            <label>Amount ($)</label>
                            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Type</label>
                                <select id="type">
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <input type="text" id="category" placeholder="e.g. Food, Rent, Salary" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <button type="submit">Add Item</button>
                    </form>
                </div>

                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <!-- Transactions List -->
            <div class="right-panel">
                <h2>Transaction History</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list">
                            <!-- Populated dynamically via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
